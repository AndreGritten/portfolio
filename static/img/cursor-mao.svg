<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
  <!--
    A variante de "selecionável": links, botões e afins.

    Mesma silhueta e MESMA PONTA (3, 2) da seta padrão, para o hotspot não se
    deslocar na troca. O que muda é o losango carmim ao lado — a mesma figura
    que o campo.js desenha nos nós da treliça, que é o vocabulário visual da
    página para "aqui tem algo".

    Preenchimento em carmim-claro (#E5566B) em vez de osso: a diferença
    precisa se ler no canto do olho, sem exigir comparação.
  -->
  <path d="M3 2 L3 21.5 L8.2 16.8 L11.7 24.6 L15.1 23.1 L11.7 15.5 L18.6 14.8 Z"
        fill="#E5566B" stroke="#0B0A0C" stroke-width="1.6" stroke-linejoin="round"/>
  <path d="M24 5.5 L27.5 9 L24 12.5 L20.5 9 Z"
        fill="#E5566B" stroke="#0B0A0C" stroke-width="1.4" stroke-linejoin="round"/>
</svg>
