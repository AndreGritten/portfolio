<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- O monograma da página, no ônix da marca com contorno de carmim claro.
       SVG e não PNG: a aba do navegador é o único lugar onde o ícone aparece
       em quatro tamanhos diferentes, e um só arquivo resolve todos. -->
  <rect width="64" height="64" rx="14" fill="#0B0A0C"/>
  <rect x="4.5" y="4.5" width="55" height="55" rx="11" fill="none" stroke="#E5566B" stroke-width="3"/>
  <text x="32" y="43"
        font-family="'JetBrains Mono', ui-monospace, 'Consolas', monospace"
        font-size="26" font-weight="700" letter-spacing="0.5"
        text-anchor="middle" fill="#E5566B">AG</text>
</svg>
