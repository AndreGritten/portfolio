<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="AG">
  <!-- O monograma AG na variante monoline: só o contorno, em carmim-claro,
       sem quadrado e sem fundo. É a marca do cabeçalho e do rodapé, onde ela
       pousa sobre superfícies diferentes e um fundo próprio brigaria com elas.

       A geometria é REGULARIZADA, não traçada crua. O desenho de origem era
       um raster de 287px com ruído de compressão, e seguir a borda de pixel
       dele deixava toda diagonal serrilhada — no tamanho grande o A saía
       enrugado. Cada aresta foi girada para o ângulo dominante a que pertence
       e os cantos refeitos como interseção das retas vizinhas. São 39
       vértices em vez de 182, e as retas são retas de verdade.

       Espessura 2,4 no viewBox de 64: medida no tamanho real de uso (36px).
       Abaixo disso o contorno interno fecha e o A some dentro do G. -->
